[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sugar-repro"
version = "0.3.0"
description = "Auditable implementation of SUGAR with temporally committed semantic profiles"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "torch==2.3.1", "PyYAML==6.0.2", "jsonschema==4.23.0"]

[project.optional-dependencies]
fallback = ["spacy==3.7.5"]
semantic = ["transformers==4.45.2", "sentence-transformers==3.1.1", "huggingface-hub==0.25.2"]
analysis = ["scipy==1.14.1", "scikit-learn==1.5.2"]
llara = ["transformers==4.45.2", "peft==0.13.2", "accelerate==0.34.2", "huggingface-hub==0.25.2"]

[project.scripts]
sugar = "sugar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sugar = ["paper_reference.json"]
